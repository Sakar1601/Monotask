# Without this, GoTrue falls back to its built-in default site_url
# (http://127.0.0.1:3000), which nothing listens on for this project's dev
# server (Vite runs on 8080, or 8081 if 8080 is taken) - causing every
# OAuth redirect (sign-in and the Connect Google flow) to land on a dead
# port instead of the app.
[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://localhost:8081", "http://127.0.0.1:8080", "http://127.0.0.1:8081"]

# Platform-level JWT verification runs even on CORS preflight (OPTIONS)
# requests, which never carry an Authorization header - that blocks the
# preflight before it reaches our code. Both functions do their own
# supabase.auth.getUser() check internally, so disable the platform gate.
[functions.weekly-summary]
verify_jwt = false

[functions.parse-task]
verify_jwt = false

# Invoked from the browser via supabase.functions.invoke(), which sends a
# JSON Content-Type and therefore triggers a CORS preflight; the function
# does its own supabase.auth.getUser() check internally.
[functions.integration-oauth-start]
verify_jwt = false

# Hit directly by Google's browser redirect after OAuth consent, which
# carries no JWT at all - the platform-level JWT gate must be off. There is
# no user auth check to replace it with; the function authenticates the
# request via the oauth_states "state" row instead.
[functions.integration-oauth-callback]
verify_jwt = false

[functions.sync-integrations]
verify_jwt = false

# Cron-invoked with the service-role key, same as sync-integrations.
[functions.scan-messages]
verify_jwt = false

# Cron-invoked with the service-role key, same as sync-integrations.
[functions.detect-conflicts]
verify_jwt = false

# Invoked from the browser via supabase.functions.invoke(), which triggers
# a CORS preflight; the function does its own supabase.auth.getUser() check
# internally (same reasoning as integration-oauth-start).
[functions.push-integration-change]
verify_jwt = false

# Google as a Supabase Auth sign-in provider (separate from the
# GOOGLE_CLIENT_ID/SECRET function secrets used by the "Connect Google"
# calendar/task-sync flow - Auth needs its own OAuth client credentials,
# read from env vars here rather than hardcoded).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"