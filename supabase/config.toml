project_id = "masofmjpnpnxjooqdajl"

# Platform-level JWT verification runs even on CORS preflight (OPTIONS)
# requests, which never carry an Authorization header - that blocks the
# preflight before it reaches our code. Both functions do their own
# supabase.auth.getUser() check internally, so disable the platform gate.
[functions.weekly-summary]
verify_jwt = false

[functions.parse-task]
verify_jwt = false

# Invoked from the browser via supabase.functions.invoke(), which sends a
# JSON Content-Type and therefore triggers a CORS preflight; the function
# does its own supabase.auth.getUser() check internally.
[functions.integration-oauth-start]
verify_jwt = false

# Hit directly by Google's browser redirect after OAuth consent, which
# carries no JWT at all - the platform-level JWT gate must be off. There is
# no user auth check to replace it with; the function authenticates the
# request via the oauth_states "state" row instead.
[functions.integration-oauth-callback]
verify_jwt = false

[functions.sync-integrations]
verify_jwt = false