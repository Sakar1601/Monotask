<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monotask - Minimal Productivity Suite</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="description" content="A minimal, monochrome productivity system combining tasks, calendar, habits, and analytics" />
    <meta name="author" content="Monotask" />
    
    <!-- Google Fonts - Geist (body) + Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta property="og:title" content="Monotask - Minimal Productivity Suite" />
    <meta property="og:description" content="A minimal, monochrome productivity system combining tasks, calendar, habits, and analytics" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@monotask_app" />

    <!-- Applies the dark class before first paint so dark-by-default doesn't
         flash light for a frame while React mounts and useSettings/the
         landing ThemeToggle catch up. Mirrors the same stored-key/fallback
         logic those two use, so all three stay in agreement. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('monotask-landing-theme');
          var dark = stored ? stored === 'dark' : true;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
